<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/iconhtml.png" type="image/png">
    <title>Вход — Clover</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass-panel { background: rgba(22,22,26,0.9); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .grid-bg {
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 0, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 0, black 30%, transparent 75%);
        }
        input {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 10px 14px; color: #f3f4f6; font-size: 14px;
            outline: none; transition: border-color 0.15s; width: 100%;
        }
        input:focus { border-color: #6366f1; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.15s; border: none; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        :focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="fixed inset-0 grid-bg pointer-events-none"></div>

    <div class="relative min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel rounded-2xl p-8 max-w-sm w-full">
            <div class="text-center mb-6">
                <a href="/" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 mb-4">
                    <i class="ph ph-shield-star text-3xl text-indigo-400"></i>
                </a>
                <h1 class="text-2xl font-bold text-white">Вход в Clover</h1>
                <p class="text-gray-500 text-sm mt-1">Fear Project · панель проверки игроков</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Логин</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <p id="error" class="hidden text-rose-400 text-sm text-center"></p>
                <button type="submit" id="submitBtn" class="btn btn-primary w-full">
                    <i class="ph ph-sign-in"></i>Войти
                </button>
            </form>
            <p class="text-center mt-6"><a href="/" class="text-gray-500 hover:text-white text-xs transition-colors">← На главную</a></p>
        </div>
    </div>

    <script>
        function safeNext() {
            const next = new URLSearchParams(location.search).get('next') || '/scans';
            return next.startsWith('/') && !next.startsWith('//') ? next : '/scans';
        }

        // Уже залогинен — сразу на целевую страницу
        (async () => {
            try {
                const u = JSON.parse(localStorage.getItem('user') || '{}');
                if (!u.sessionToken) return;
                const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + u.sessionToken } });
                if (res.ok) window.location.replace(safeNext());
            } catch (_) {}
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error');
            const btn = document.getElementById('submitBtn');
            errEl.classList.add('hidden');
            btn.disabled = true;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.message || ('Ошибка: ' + res.status);
                    errEl.classList.remove('hidden');
                    return;
                }
                localStorage.setItem('user', JSON.stringify({ ...data.user, sessionToken: data.token }));
                window.location.replace(safeNext());
            } catch (err) {
                errEl.textContent = 'Ошибка соединения: ' + err.message;
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
