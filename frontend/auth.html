<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/iconhtml.png" type="image/png">
    <title>Вход — Clover</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/clover.css">
    <style>
        .auth-card { animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
        .shake { animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
        @media (prefers-reduced-motion: reduce) { .auth-card, .shake { animation: none; } }
    </style>
</head>
<body class="clover-field">
    <div class="scanline"></div>
    <div class="relative min-h-screen flex items-center justify-center p-6">
        <div class="glass p-8 max-w-sm w-full auth-card">
            <div class="text-center mb-7">
                <a href="/" class="radar-badge radar-lg mb-5">
                    <i class="ph ph-clover text-3xl text-emerald-300"></i>
                </a>
                <h1 class="font-display text-xl font-semibold text-white">Вход в Clover</h1>
                <p class="text-emerald-200/40 text-sm mt-2">Fear Project · панель проверки игроков</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-emerald-200/50 uppercase tracking-wider mb-2">Логин</label>
                    <input id="username" name="username" type="text" autocomplete="username" class="w-full" required autofocus>
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-emerald-200/50 uppercase tracking-wider mb-2">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" class="w-full" required>
                </div>
                <p id="error" class="hidden text-rose-300 text-sm text-center"></p>
                <button type="submit" id="submitBtn" class="btn btn-primary w-full">
                    <i class="ph ph-sign-in"></i>Войти
                </button>
            </form>
            <p class="text-center mt-6"><a href="/" class="text-emerald-200/40 hover:text-emerald-100 text-xs transition-colors">← На главную</a></p>
        </div>
    </div>

    <script>
        function safeNext() {
            const next = new URLSearchParams(location.search).get('next') || '/scans';
            return next.startsWith('/') && !next.startsWith('//') ? next : '/scans';
        }

        // Уже залогинен — сразу на целевую страницу
        (async () => {
            try {
                const u = JSON.parse(localStorage.getItem('user') || '{}');
                if (!u.sessionToken) return;
                const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + u.sessionToken } });
                if (res.ok) window.location.replace(safeNext());
            } catch (_) {}
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error');
            const btn = document.getElementById('submitBtn');
            errEl.classList.add('hidden');
            btn.disabled = true;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.message || ('Ошибка: ' + res.status);
                    errEl.classList.remove('hidden');
                    errEl.classList.remove('shake');
                    void errEl.offsetWidth;
                    errEl.classList.add('shake');
                    return;
                }
                localStorage.setItem('user', JSON.stringify({ ...data.user, sessionToken: data.token }));
                window.location.replace(safeNext());
            } catch (err) {
                errEl.textContent = 'Ошибка соединения: ' + err.message;
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
