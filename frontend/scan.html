<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/iconhtml.png" type="image/png">
    <title>Скан — Clover</title>
    <link rel="stylesheet" href="/vendor/tailwind.css">
    <link rel="stylesheet" href="/vendor/phosphor/style.css">
    <link rel="stylesheet" href="/vendor/fonts.css">
    <link rel="stylesheet" href="/css/clover.css">
    <style>
        .th-sort { cursor: pointer; user-select: none; white-space: nowrap; }
        .th-sort:hover { color: var(--text); }
        .th-sort .sort-arrow { font-size: 10px; margin-left: 4px; opacity: .7; }
        .tab-badge { margin-left: auto; font-size: 10px; opacity: .75; flex: none; }
        td { vertical-align: top; }
        .path-cell { word-break: break-all; }

        /* Каркас страницы скана: шапка + сгруппированный сайдбар вкладок */
        .scan-shell { display: flex; flex: 1; align-items: stretch; min-height: 0; }
        .scan-tabs {
            width: 232px;
            flex: none;
            position: sticky;
            top: 65px; /* высота шапки */
            align-self: flex-start;
            max-height: calc(100vh - 65px);
            overflow-y: auto;
            padding: 14px 10px 20px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            scrollbar-width: thin;
        }
        .scan-tabs-group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-faint); padding: 12px 10px 5px; }
        .scan-tabs-group:first-child { padding-top: 2px; }
        .scan-tab {
            display: flex; align-items: center; gap: 9px;
            width: 100%; padding: 7px 10px;
            border: none; background: none; cursor: pointer;
            border-radius: var(--radius-ctl);
            font-size: 13px; font-weight: 500; font-family: inherit;
            color: var(--text-dim); text-align: left;
            transition: background .13s, color .13s;
            border-left: 3px solid transparent;
        }
        .scan-tab:hover { background: var(--surface-2); color: var(--text); }
        .scan-tab.active { background: rgba(52,211,153,.10); color: var(--mint); border-left-color: var(--emerald); border-radius: 0 var(--radius-ctl) var(--radius-ctl) 0; }
        .scan-tab i { font-size: 16px; flex: none; }
        .scan-tab.empty { opacity: .42; }
        .scan-tab .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        [data-theme="light"] .scan-tab.active { background: rgba(5,150,105,.10); }

        .scan-main { flex: 1; min-width: 0; padding: 18px 26px 48px; }
        .scan-main-inner { max-width: 1500px; margin: 0 auto; }

        @media (max-width: 900px) {
            .scan-shell { flex-direction: column; }
            .scan-tabs {
                width: 100%; position: static; max-height: none;
                display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden;
                padding: 8px 10px; border-right: none; border-bottom: 1px solid var(--border);
            }
            .scan-tabs-group { display: none; }
            .scan-tab { width: auto; flex: none; border-left: none; border-bottom: 2px solid transparent; border-radius: 7px; }
            .scan-tab.active { border-left: none; border-bottom-color: var(--emerald); border-radius: 7px 7px 0 0; }
            .scan-tab .tab-badge { margin-left: 4px; }
            .scan-main { padding: 14px 12px 40px; }
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <!-- Top bar -->
        <header class="flex items-center gap-4 px-6 py-4 border-b border-emerald-300/10 sticky top-0 z-20" style="background:var(--surface);backdrop-filter:blur(8px)">
            <a href="/scans" class="btn btn-secondary btn-sm"><i class="ph ph-arrow-left"></i> Все сканы</a>
            <div class="flex-1 min-w-0">
                <h1 class="text-lg font-bold text-white truncate" id="headTitle">Скан</h1>
                <p class="text-emerald-100/40 text-xs truncate" id="headSub">—</p>
            </div>
            <span id="headBadge"></span>
        </header>

        <div class="scan-shell">
            <!-- Сгруппированные вкладки -->
            <nav id="tabsBar" class="scan-tabs"></nav>

            <!-- Content -->
            <main class="scan-main">
                <div class="scan-main-inner">
                    <div id="tabSearchBar" class="mb-3 hidden">
                        <input type="text" id="tabSearch" placeholder="Поиск по таблице..." class="w-full max-w-md" oninput="onTabSearch(this.value)">
                    </div>
                    <div id="content"></div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/js/session.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const scanId = location.pathname.split('/').filter(Boolean).pop();

        // Поле записи с учётом обоих вариантов регистра ключей (Go без тегов
        // маршалит "Path", с тегами — "path").
        function g(o, ...keys) {
            if (!o) return undefined;
            for (const k of keys) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k];
            return undefined;
        }

        function cleanSerial(v) {
            const s = String(v ?? '').trim();
            const ph = ['', 'default string', 'to be filled by o.e.m.', 'to be filled', 'not available', 'not applicable', 'none', 'n/a', 'na', 'unknown', 'null'];
            return ph.includes(s.toLowerCase()) ? 'n/a' : s;
        }
        function fmtSizeGB(v) { return (v === null || v === undefined || isNaN(Number(v))) ? 'n/a' : Math.round(Number(v)) + ' GB'; }

        function matchTag(v) { return v ? `<span class="tag tag-red">${esc(v)}</span>` : ''; }

        let REC = null;
        let curTab = 'overview';
        const tabState = {}; // id -> {q, sortKey, dir}

        // ─── Tabs: сгруппированы по смыслу, hint — подсказка при наведении ──
        const TABS = [
            { id: 'overview',   label: 'Общее',             icon: 'ph-monitor',               group: 'Обзор',          hint: 'Сводка, авто-вердикт, решение проверяющего, сравнение сканов' },
            { id: 'matches',    label: 'Найденные читы',    icon: 'ph-warning',               group: 'Находки',        hint: 'Файлы, совпавшие с сигнатурами читов' },
            { id: 'dirs',       label: 'Целевые папки',     icon: 'ph-folder',                group: 'Находки',        hint: 'Папки и файлы из списка целей (по имени)' },
            { id: 'network',    label: 'Сеть и память CS2', icon: 'ph-wifi-high',             group: 'Находки',        hint: 'TCP-подключения и RWX-участки памяти cs2.exe' },
            { id: 'exectraces', label: 'Запуски программ',  icon: 'ph-footprints',            group: 'Запуски',        hint: '8 независимых источников: UserAssist, RecentApps, AppSwitched, MuiCache, AppCompat, RunMRU, ComDlg32, PCA' },
            { id: 'prefetch',   label: 'Prefetch',          icon: 'ph-rocket-launch',         group: 'Запуски',        hint: 'Кэш запусков Windows; «изменён» ≈ время последнего запуска' },
            { id: 'shimcache',  label: 'ShimCache',         icon: 'ph-database',              group: 'Запуски',        hint: 'AppCompatCache — программы, которые видел shim создания процессов' },
            { id: 'bam',        label: 'BAM / DAM',         icon: 'ph-user-switch',           group: 'Запуски',        hint: 'Запуски с точным временем по пользователям' },
            { id: 'amcache',    label: 'Amcache',           icon: 'ph-clock',                 group: 'Запуски',        hint: 'Amcache.hve — следы исполняемых файлов' },
            { id: 'timeline',   label: 'Таймлайн',          icon: 'ph-clock-countdown',       group: 'Запуски',        hint: 'Единая хронология всех артефактов — видно рассинхрон от чистки' },
            { id: 'usn',        label: 'USN-журнал',        icon: 'ph-list-magnifying-glass', group: 'Файлы и папки',  hint: 'Журнал $UsnJrnl: создания, удаления, переименования на всех дисках' },
            { id: 'shellbags',  label: 'Shellbags',         icon: 'ph-briefcase',             group: 'Файлы и папки',  hint: 'Папки, которые пользователь открывал в проводнике (включая удалённые)' },
            { id: 'appdata',    label: 'AppData',           icon: 'ph-hard-drives',           group: 'Файлы и папки',  hint: 'Подозрительные файлы в AppData\\Roaming' },
            { id: 'usb',        label: 'USB-устройства',    icon: 'ph-usb',                   group: 'Файлы и папки',  hint: 'История подключённых USB-носителей' },
            { id: 'processes',  label: 'Процессы',          icon: 'ph-gear-six',              group: 'Система',        hint: 'Снапшот процессов на момент скана' },
            { id: 'windows',    label: 'Окна',              icon: 'ph-app-window',            group: 'Система',        hint: 'Видимые окна — ловит ESP-оверлеи с названием игры' },
            { id: 'drivers',    label: 'Драйверы',          icon: 'ph-cpu',                   group: 'Система',        hint: 'Ядерные драйверы: blacklist (BYOVD), неподписанные, недавние' },
            { id: 'services',   label: 'Службы',            icon: 'ph-plug',                  group: 'Система',        hint: 'Критичные службы логирования — читеры их останавливают' },
            { id: 'cleanup',    label: 'Следы чистки',      icon: 'ph-broom',                 group: 'Анализ',         hint: 'Клинеры, fsutil/wevtutil, пересоздание USN-журнала, удалённое' }
        ];
        const TAB_GROUPS = ['Обзор', 'Находки', 'Запуски', 'Файлы и папки', 'Система', 'Анализ'];

        function hitCount(rec) {
            const flagged = (arr) => (arr || []).filter(x => x.matched || x.flag).length;
            const c = rec.cleanup || {};
            const cleanupHits = (c.iniOnDisk || []).length + (c.iniDeleted || []).length + (c.prefetchTools || []).length + (c.journals || []).filter(j => j.wiped).length;
            return (rec.results?.length || 0) + (rec.deletedFiles?.length || 0) + (rec.cs2Conns?.length || 0) + (rec.cs2Rwx?.length || 0)
                + (rec.dirs?.length || 0) + (rec.namedFiles?.length || 0)
                + flagged(rec.prefetch) + flagged(rec.shimcache) + flagged(rec.bam) + flagged(rec.processes) + flagged(rec.drivers)
                + flagged(rec.execTraces) + flagged(rec.windows) + (rec.envFlags || []).length
                + flagged(rec.shellbagsAll) + (rec.usn || []).filter(x => x.m).length + cleanupHits;
        }

        function tabCount(id, rec) {
            switch (id) {
                case 'overview': return 1;
                case 'matches': return (rec.results || []).length;
                case 'dirs': return (rec.dirs || []).length + (rec.namedFiles || []).length;
                case 'network': return (rec.cs2Conns || []).length + (rec.cs2Rwx || []).filter(r => g(r, 'BaseAddress', 'baseAddress') > 0).length;
                case 'amcache': return (rec.amcache || []).length;
                case 'shellbags': return (rec.shellbagsAll || []).length || (rec.shellbags || []).length;
                case 'appdata': return (rec.appData || []).length;
                case 'usb': return (rec.hardware?.usb || rec.usb || []).length;
                case 'prefetch': return (rec.prefetch || []).length;
                case 'shimcache': return (rec.shimcache || []).length;
                case 'bam': return (rec.bam || []).length;
                case 'exectraces': return (rec.execTraces || []).length;
                case 'timeline': return timelineRows(rec).length;
                case 'usn': return (rec.usn || []).length;
                case 'processes': return (rec.processes || []).length;
                case 'windows': return (rec.windows || []).length;
                case 'drivers': return (rec.drivers || []).length;
                case 'cleanup': { const c = rec.cleanup || {}; return (c.iniOnDisk || []).length + (c.iniDeleted || []).length + (c.prefetchTools || []).length + (c.journals || []).length + (rec.deletedFiles || []).length + (rec.deletedDirs || []).length; }
                case 'services': return (rec.services || []).length;
                default: return 0;
            }
        }

        function renderTabsBar() {
            document.getElementById('tabsBar').innerHTML = TAB_GROUPS.map(gr => {
                const items = TABS.filter(t => t.group === gr).map(t => {
                    const n = t.id === 'overview' ? 0 : tabCount(t.id, REC);
                    const active = curTab === t.id;
                    const cls = 'scan-tab' + (active ? ' active' : '') + (n === 0 ? ' empty' : '');
                    return `<button class="${cls}" title="${esc(t.hint || '')}" onclick="switchTab('${t.id}')"><i class="ph ${t.icon}"></i><span class="lbl">${esc(t.label)}</span>${n ? `<span class="tab-badge">${n}</span>` : ''}</button>`;
                }).join('');
                return `<div class="scan-tabs-group">${esc(gr)}</div>${items}`;
            }).join('');
        }

        function switchTab(id) {
            curTab = id;
            renderTabsBar();
            renderContent();
        }

        // ─── Generic searchable + sortable table ──────────────────────────
        // columns: [{key, label, sort: 'str'|'num'|'date', cls, val(row)=>raw, html(row)=>string}]
        // В DOM выводим порциями по PAGE_SIZE — иначе вкладки с десятками
        // тысяч строк (USN-журнал) вешают браузер на построении innerHTML.
        const PAGE_SIZE = 500;

        function st(id) {
            if (!tabState[id]) tabState[id] = { q: '', sortKey: null, dir: 1, limit: PAGE_SIZE };
            return tabState[id];
        }

        function onTabSearch(v) {
            const s = st(curTab);
            s.q = v;
            s.limit = PAGE_SIZE; // новый поиск — снова с первой страницы
            renderContent();
        }

        function showMore(id) {
            st(id).limit += PAGE_SIZE;
            renderContent();
        }

        // Фильтр по причинам (чипы DELETE/CREATE/RENAME_...) на вкладке USN
        function toggleUsnReason(t) {
            const s = st('usn');
            if (!s.reasons) s.reasons = {};
            s.reasons[t] = !s.reasons[t];
            s.limit = PAGE_SIZE;
            renderContent();
        }
        function clearUsnReasons() {
            const s = st('usn');
            s.reasons = {};
            s.limit = PAGE_SIZE;
            renderContent();
        }

        // Фильтр по источникам (UserAssist/PCA/...) на вкладке «Запуски»
        function toggleExecSource(t) {
            const s = st('exectraces');
            if (!s.sources) s.sources = {};
            s.sources[t] = !s.sources[t];
            s.limit = PAGE_SIZE;
            renderContent();
        }
        function clearExecSources() {
            const s = st('exectraces');
            s.sources = {};
            s.limit = PAGE_SIZE;
            renderContent();
        }

        function sortBy(id, key) {
            const s = st(id);
            if (s.sortKey === key) { s.dir = -s.dir; } else { s.sortKey = key; s.dir = 1; }
            renderContent();
        }

        function renderTable(id, columns, rows, emptyText) {
            const s = st(id);
            let data = rows || [];
            const q = (s.q || '').trim().toLowerCase();
            if (q) {
                data = data.filter(r => columns.some(c => String(c.val(r) ?? '').toLowerCase().includes(q)));
            }
            if (s.sortKey) {
                const col = columns.find(c => c.key === s.sortKey);
                if (col) {
                    const typ = col.sort || 'str';
                    data = [...data].sort((a, b) => {
                        let va = col.val(a), vb = col.val(b);
                        if (typ === 'num') { va = Number(va) || 0; vb = Number(vb) || 0; return (va - vb) * s.dir; }
                        if (typ === 'date') { va = new Date(va || 0).getTime() || 0; vb = new Date(vb || 0).getTime() || 0; return (va - vb) * s.dir; }
                        return String(va ?? '').localeCompare(String(vb ?? ''), 'ru') * s.dir;
                    });
                }
            }
            if (!data.length) return `<div class="empty-state"><i class="ph ph-ghost"></i>${esc(emptyText || 'Пусто')}</div>`;
            const shown = data.length > s.limit ? data.slice(0, s.limit) : data;
            const arrow = k => s.sortKey === k ? `<span class="sort-arrow">${s.dir > 0 ? '▲' : '▼'}</span>` : '';
            let html = `<div class="panel"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-emerald-300/15">`;
            columns.forEach(c => { html += `<th class="text-left py-2 px-3 th-sort" onclick="sortBy('${id}','${c.key}')">${esc(c.label)}${arrow(c.key)}</th>`; });
            html += `</tr></thead><tbody>`;
            shown.forEach(r => {
                const hot = r._hot ? ' bg-rose-500/5' : '';
                html += `<tr class="border-b border-emerald-300/10${hot}">` + columns.map(c => `<td class="py-2 px-3 ${c.cls || ''}">${c.html(r)}</td>`).join('') + `</tr>`;
            });
            const more = data.length - shown.length;
            const footerText = more > 0 ? `Показано ${shown.length} из ${data.length}` : `${data.length} записей`;
            const moreBtn = more > 0 ? ` <button class="btn btn-secondary btn-sm" style="margin-left:10px" onclick="showMore('${id}')">Ещё ${Math.min(PAGE_SIZE, more)}</button>` : '';
            html += `</tbody></table></div><div class="px-4 py-2 text-emerald-100/30 text-xs border-t border-emerald-300/10">${footerText}${moreBtn}</div></div>`;
            return html;
        }

        // Колонки-хелперы
        const colName = { key: 'name', label: 'Имя', sort: 'str', val: r => g(r, 'Name', 'name'), html: r => `<span class="whitespace-nowrap">${esc(g(r, 'Name', 'name') ?? '-')}</span>` };
        const colPath = { key: 'path', label: 'Путь', sort: 'str', cls: 'path-cell', val: r => g(r, 'Path', 'path', 'FilePath', 'filePath', 'DirPath', 'dirPath'), html: r => `<span class="mono text-xs text-emerald-100/60">${esc(g(r, 'Path', 'path', 'FilePath', 'filePath', 'DirPath', 'dirPath') ?? '-')}</span>` };
        const colMatched = { key: 'matched', label: 'Совпадение', sort: 'str', val: r => g(r, 'Matched', 'matched', 'flag'), html: r => matchTag(g(r, 'Matched', 'matched') || g(r, 'flag')) };
        function colDate(key, label, ...fields) {
            return { key, label, sort: 'date', cls: 'whitespace-nowrap text-emerald-100/40 text-xs', val: r => g(r, ...fields), html: r => esc(fmtTs(g(r, ...fields))) };
        }

        // ─── Per-tab data builders ────────────────────────────────────────
        function tabTable(id, rec) {
            switch (id) {
                case 'matches':
                    return renderTable(id, [
                        colName, colMatched, colPath,
                        colDate('modified', 'Изменён', 'Modified', 'modified'),
                        colDate('deleted', 'Удалён', 'Deleted', 'deleted')
                    ], (rec.results || []), 'Нет совпадений — чисто');

                case 'dirs': {
                    const rows = [
                        ...(rec.dirs || []).map(d => ({ ...d, _type: 'директория', _hot: true })),
                        ...(rec.namedFiles || []).map(f => ({ ...f, _type: 'файл' }))
                    ];
                    return renderTable(id, [
                        { key: 'type', label: 'Тип', sort: 'str', val: r => r._type, html: r => `<span class="tag tag-amber">${r._type}</span>` },
                        colName, colPath, colDate('modified', 'Изменён', 'Modified', 'modified')
                    ], rows, 'Нет целевых директорий/файлов');
                }

                case 'network': {
                    const conns = (rec.cs2Conns || []).map(c => ({
                        _type: 'TCP', _hot: true,
                        _a: `${g(c, 'RemoteAddress', 'remoteAddress')}:${g(c, 'RemotePort', 'remotePort')}`,
                        _b: `${g(c, 'LocalAddress', 'localAddress')}:${g(c, 'LocalPort', 'localPort')}`,
                        _c: g(c, 'State', 'state'), _d: ''
                    }));
                    const rwx = (rec.cs2Rwx || []).filter(r => g(r, 'BaseAddress', 'baseAddress') > 0).map(r => ({
                        _type: 'RWX', _hot: true,
                        _a: '0x' + Number(g(r, 'BaseAddress', 'baseAddress')).toString(16),
                        _b: Math.round(Number(g(r, 'RegionSize', 'regionSize') || 0) / 1024) + ' KB',
                        _c: g(r, 'Protection', 'protection'), _d: g(r, 'RegionType', 'regionType')
                    }));
                    const rows = [...conns, ...rwx];
                    return '<p class="text-emerald-100/40 text-xs mb-2">TCP-подключения и RWX-участки памяти cs2.exe на момент сканирования</p>' + renderTable(id, [
                        { key: 'type', label: 'Тип', sort: 'str', val: r => r._type, html: r => `<span class="tag tag-red">${r._type}</span>` },
                        { key: 'a', label: 'Удалённый адрес / Адрес', sort: 'str', cls: 'mono text-xs text-rose-300', val: r => r._a, html: r => esc(r._a) },
                        { key: 'b', label: 'Локальный / Размер', sort: 'str', cls: 'mono text-xs text-emerald-100/60', val: r => r._b, html: r => esc(r._b) },
                        { key: 'c', label: 'Состояние / Доступ', sort: 'str', val: r => r._c, html: r => esc(r._c || '-') },
                        { key: 'd', label: 'Тип памяти', sort: 'str', val: r => r._d, html: r => esc(r._d || '-') }
                    ], rows, 'cs2.exe не был запущен / сетевых данных нет');
                }

                case 'amcache':
                    return renderTable(id, [
                        colName, colPath, colDate('lastrun', 'Последний запуск', 'LastRun', 'lastRun')
                    ], (rec.amcache || []).map(a => ({ ...a, _hot: true })), 'Нет данных Amcache');

                case 'shellbags': {
                    const all = rec.shellbagsAll || [];
                    if (all.length) {
                        const rows = all.map(s => ({ ...s, _hot: !!s.matched || s.type === 'deleted' }));
                        return '<p class="text-emerald-100/40 text-xs mb-2">Все папки из проводника (BagMRU), включая стёртые записи. «Удалённая» — слот выпал из MRUListEx.</p>' + renderTable(id, [
                            { key: 'name', label: 'Имя', sort: 'str', val: r => r.name, html: r => `<span class="whitespace-nowrap">${esc(r.name || '-')}</span>${matchTag(r.matched)}` },
                            { key: 'path', label: 'Путь', sort: 'str', cls: 'path-cell', val: r => r.path, html: r => `<span class="mono text-xs text-emerald-100/60">${esc(r.path || '-')}</span>` },
                            { key: 'type', label: 'Тип', sort: 'str', val: r => r.type, html: r => r.type === 'deleted' ? '<span class="tag tag-amber">удалённая</span>' : '<span class="tag tag-green">существующая</span>' },
                            { key: 'slot', label: 'Слот', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.slot, html: r => esc(String(r.slot ?? '-')) },
                            colDate('created', 'Создана', 'created'),
                            colDate('modified', 'Изменена', 'modified'),
                            colDate('accessed', 'Открыта', 'accessed'),
                            colDate('keymod', 'Запись изменена', 'keyModified')
                        ], rows, 'Нет Shellbags');
                    }
                    // Старые сканы: только hits.
                    return renderTable(id, [
                        colName, colPath, colDate('lastaccess', 'Последний доступ', 'LastAccess', 'lastAccess')
                    ], (rec.shellbags || []).map(s => ({ ...s, _hot: true })), 'Нет Shellbags');
                }

                case 'appdata':
                    return renderTable(id, [
                        { key: 'file', label: 'Файл', sort: 'str', cls: 'mono text-xs', val: r => g(r, 'FileName', 'fileName'), html: r => esc(g(r, 'FileName', 'fileName') ?? '-') },
                        { key: 'dir', label: 'Директория', sort: 'str', cls: 'path-cell', val: r => g(r, 'DirPath', 'dirPath'), html: r => `<span class="mono text-xs text-emerald-100/60">${esc(g(r, 'DirPath', 'dirPath') ?? '-')}</span>` },
                        colDate('dirmod', 'Дир. изменена', 'DirModified', 'dirModified'),
                        colDate('filemod', 'Файл изменён', 'FileModified', 'fileModified')
                    ], (rec.appData || []).map(a => ({ ...a, _hot: true })), 'Нет подозрительных AppData');

                case 'usb': {
                    const usb = rec.hardware?.usb || rec.usb || [];
                    return renderTable(id, [
                        { key: 'fn', label: 'Устройство', sort: 'str', val: r => g(r, 'friendlyName', 'FriendlyName'), html: r => esc(g(r, 'friendlyName', 'FriendlyName') ?? '-') },
                        { key: 'vidpid', label: 'VID:PID', sort: 'str', cls: 'mono text-xs', val: r => (g(r, 'vid', 'VID') || '') + (g(r, 'pid', 'PID') || ''), html: r => esc((g(r, 'vid', 'VID') || '-') + ':' + (g(r, 'pid', 'PID') || '-')) },
                        { key: 'serial', label: 'Серийник', sort: 'str', cls: 'mono text-xs', val: r => g(r, 'serialNumber', 'SerialNumber'), html: r => esc(g(r, 'serialNumber', 'SerialNumber') ?? '-') },
                        colDate('first', 'Первое подключение', 'firstSeen', 'FirstSeen'),
                        colDate('last', 'Последнее подключение', 'lastSeen', 'LastSeen')
                    ], usb, 'Нет USB устройств');
                }

                case 'prefetch':
                    return '<p class="text-emerald-100/40 text-xs mb-2">Имя программы из .pf файла; «Изменён» ≈ время последнего запуска</p>' + renderTable(id, [
                        { key: 'name', label: 'Программа', sort: 'str', cls: 'mono text-xs', val: r => r.name, html: r => esc(r.name ?? '-') },
                        colDate('modified', 'Изменён (посл. запуск)', 'modified'),
                        colDate('created', 'Создан', 'created'),
                        colMatched
                    ], (rec.prefetch || []).map(p => ({ ...p, _hot: !!p.matched })), 'Нет данных Prefetch (нужны права администратора; Prefetch может быть выключен)');

                case 'shimcache':
                    return '<p class="text-emerald-100/40 text-xs mb-2">Программы, которые видел shim создания процессов; «Запуск» — точно исполнялась</p>' + renderTable(id, [
                        colPath,
                        colDate('modified', 'Изменён', 'modified'),
                        { key: 'exec', label: 'Запуск', sort: 'str', val: r => r.executed ? 1 : 0, html: r => r.executed ? '<span class="tag tag-green">да</span>' : '<span class="text-emerald-100/30">—</span>' },
                        colMatched
                    ], (rec.shimcache || []).map(s => ({ ...s, _hot: !!s.matched })), 'Нет данных ShimCache');

                case 'bam':
                    return renderTable(id, [
                        { key: 'src', label: 'Источник', sort: 'str', val: r => r.source, html: r => `<span class="tag tag-muted">${esc(r.source)}</span>` },
                        colPath,
                        colDate('lastrun', 'Последний запуск', 'lastRun'),
                        { key: 'sid', label: 'SID', sort: 'str', cls: 'mono text-xs text-emerald-100/40', val: r => r.userSid, html: r => esc(r.userSid ?? '-') },
                        colMatched
                    ], (rec.bam || []).map(b => ({ ...b, _hot: !!b.matched })), 'Нет данных BAM/DAM');

                case 'exectraces': {
                    const srcNames = { userassist: 'UserAssist', recentapps: 'RecentApps', appswitched: 'AppSwitched', muicache: 'MuiCache', appcompatstore: 'AppCompat Store', runmru: 'RunMRU', comdlg32: 'ComDlg32', pca: 'PCA' };
                    const s = st(id);
                    if (!s.sources) s.sources = {};
                    const all = rec.execTraces || [];
                    const srcCounts = {};
                    all.forEach(r => { const k = r.source || '?'; srcCounts[k] = (srcCounts[k] || 0) + 1; });
                    const active = Object.keys(s.sources).filter(k => s.sources[k] && srcCounts[k]);
                    const rows = (active.length ? all.filter(r => s.sources[r.source]) : all).map(r => ({ ...r, _hot: !!r.matched }));
                    let chips = '';
                    const keys = Object.keys(srcCounts).sort((a, b) => srcCounts[b] - srcCounts[a]);
                    if (keys.length) {
                        chips = `<div class="flex flex-wrap items-center gap-2 mb-3">`
                            + keys.map(k => `<button class="tag ${s.sources[k] ? 'tag-amber' : 'tag-muted'}" style="cursor:pointer" onclick="toggleExecSource('${k}')">${esc(srcNames[k] || k)} <span style="opacity:.65">${srcCounts[k]}</span></button>`).join('')
                            + (active.length ? `<button class="btn btn-ghost btn-sm" onclick="clearExecSources()"><i class="ph ph-x"></i> сбросить</button>` : '')
                            + `</div>`;
                    }
                    return `<p class="text-emerald-100/40 text-xs mb-2">Артефакты запуска программ из 8 независимых источников Windows (UserAssist, RecentApps, AppSwitched, MuiCache, AppCompat Store, RunMRU, ComDlg32, PCA). Удаление одного источника (например Prefetch) не стирает остальные — рассинхрон между ними и есть след чистки. Клик по источнику фильтрует таблицу.</p>` + chips + renderTable(id, [
                        { key: 'src', label: 'Источник', sort: 'str', val: r => r.source, html: r => `<span class="tag tag-muted">${esc(srcNames[r.source] || r.source)}</span>` },
                        { key: 'name', label: 'Программа', sort: 'str', cls: 'mono text-xs', val: r => r.name, html: r => `<span class="whitespace-nowrap">${esc(r.name ?? '-')}</span>` },
                        { key: 'path', label: 'Путь', sort: 'str', cls: 'path-cell', val: r => r.path, html: r => `<span class="mono text-xs text-emerald-100/60">${esc(r.path ?? '-')}</span>` },
                        { key: 'count', label: 'Запусков', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.count || 0, html: r => esc(r.count ? String(r.count) : '-') },
                        colDate('lastrun', 'Последний запуск', 'lastRun'),
                        { key: 'extra', label: 'Доп.', sort: 'str', cls: 'text-xs text-emerald-100/40', val: r => r.extra, html: r => esc(r.extra ?? '-') },
                        colMatched
                    ], rows, 'Нет артефактов запуска (скан старой версии)');
                }

                case 'windows':
                    return '<p class="text-emerald-100/40 text-xs mb-2">Видимые окна на момент сканирования — ESP-оверлеи часто выглядят как безрамочные окна с названием игры</p>' + renderTable(id, [
                        { key: 'title', label: 'Заголовок', sort: 'str', val: r => r.title, html: r => esc(r.title ?? '-') },
                        { key: 'proc', label: 'Процесс', sort: 'str', cls: 'mono text-xs', val: r => r.process, html: r => esc(r.process ?? '-') },
                        { key: 'path', label: 'Путь', sort: 'str', cls: 'path-cell', val: r => r.path, html: r => `<span class="mono text-xs text-emerald-100/60">${esc(r.path ?? '-')}</span>` },
                        colMatched
                    ], (rec.windows || []).map(w => ({ ...w, _hot: !!w.matched })), 'Нет данных об окнах (скан старой версии)');

                case 'timeline': {
                    const rows = timelineRows(rec);
                    return '<p class="text-emerald-100/40 text-xs mb-2">Единая хронология всех артефактов: запуски программ, удаления файлов, события USN. Рассинхрон (файл удалён, а запуска нигде нет) — след чистки.</p>' + renderTable(id, [
                        { key: 't', label: 'Время', sort: 'date', cls: 'whitespace-nowrap text-emerald-100/40 text-xs', val: r => r._t, html: r => esc(fmtTs(r._t)) },
                        { key: 'src', label: 'Источник', sort: 'str', val: r => r._src, html: r => `<span class="tag tag-muted">${esc(r._src)}</span>` },
                        { key: 'what', label: 'Событие', sort: 'str', cls: 'text-xs', val: r => r._what, html: r => esc(r._what) },
                        { key: 'path', label: 'Объект', sort: 'str', cls: 'path-cell', val: r => r._path, html: r => `<span class="mono text-xs ${r._hot ? 'text-rose-300' : 'text-emerald-100/60'}">${esc(r._path || '-')}</span>` }
                    ], rows, 'Нет событий со временем (скан старой версии)');
                }

                case 'usn': {
                    const s = st(id);
                    if (!s.reasons) s.reasons = {};
                    const all = rec.usn || [];
                    // Частоты причин одним проходом — для чипов-фильтра.
                    // Токены — enum сканера, белый список A-Z0-9_ отсекает мусор.
                    const reasonCounts = {};
                    all.forEach(u => String(u.r || '').split('|').forEach(t => {
                        if (/^[A-Z0-9_]+$/.test(t)) reasonCounts[t] = (reasonCounts[t] || 0) + 1;
                    }));
                    const active = Object.keys(s.reasons).filter(t => s.reasons[t] && reasonCounts[t]);
                    const filtered = active.length
                        ? all.filter(u => String(u.r || '').split('|').some(t => s.reasons[t]))
                        : all;
                    const rows = filtered.map(u => ({ ...u, _hot: !!u.m }));
                    let chips = '';
                    const tokens = Object.keys(reasonCounts).sort((a, b) => reasonCounts[b] - reasonCounts[a]);
                    if (tokens.length) {
                        chips = `<div class="flex flex-wrap items-center gap-2 mb-3">`
                            + tokens.map(t => `<button class="tag ${s.reasons[t] ? 'tag-amber' : 'tag-muted'}" style="cursor:pointer" onclick="toggleUsnReason('${t}')">${t} <span style="opacity:.65">${reasonCounts[t]}</span></button>`).join('')
                            + (active.length ? `<button class="btn btn-ghost btn-sm" onclick="clearUsnReasons()"><i class="ph ph-x"></i> сбросить</button>` : '')
                            + `</div>`;
                    }
                    const countTxt = all.length ? (active.length ? ` (${rows.length} из ${all.length} после фильтра)` : ` (${all.length})`) : '';
                    return `<p class="text-emerald-100/40 text-xs mb-2">Журнал $UsnJrnl всех дисков (как в JournalTrace): создания, удаления, переименования и изменения файлов. Показаны самые свежие записи${countTxt}. Искать можно по всему: имени, пути, событию (DELETE, CREATE, RENAME...). Клик по причине ниже фильтрует таблицу. Совпадения с именами из «Сигнатур» подсвечены.</p>` + chips + renderTable(id, [
                        colDate('t', 'Время', 't'),
                        { key: 'd', label: 'Диск', sort: 'str', cls: 'mono text-xs', val: r => r.d, html: r => esc(r.d ?? '-') },
                        { key: 'n', label: 'Имя', sort: 'str', cls: 'path-cell', val: r => r.n, html: r => `<span class="mono text-xs">${esc(r.n ?? '-')}</span>${r.dir ? ' <span class="tag tag-muted">dir</span>' : ''}` },
                        { key: 'p', label: 'Путь', sort: 'str', cls: 'path-cell', val: r => r.p, html: r => `<span class="mono text-xs text-emerald-100/60">${esc(r.p ?? '-')}</span>` },
                        { key: 'r', label: 'События', sort: 'str', cls: 'whitespace-nowrap', val: r => r.r, html: r => reasonTags(r.r) },
                        { key: 'm', label: 'Совпадение', sort: 'str', val: r => r.m, html: r => matchTag(r.m) }
                    ], rows, 'Нет записей USN (нужны права администратора или скан старой версии)');
                }

                case 'processes':
                    return renderTable(id, [
                        { key: 'pid', label: 'PID', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.pid, html: r => esc(String(r.pid ?? '-')) },
                        colName, colPath, colMatched
                    ], (rec.processes || []).map(p => ({ ...p, _hot: !!p.matched })), 'Нет данных о процессах');

                case 'drivers':
                    return '<p class="text-emerald-100/40 text-xs mb-2">blacklist — известный злоупотребляемый (BYOVD) драйвер; recent — недавно добавленный нестандартный</p>' + renderTable(id, [
                        colName,
                        { key: 'kind', label: 'Тип', sort: 'str', cls: 'text-xs text-emerald-100/40', val: r => r.kind, html: r => esc(r.kind ?? '-') },
                        { key: 'img', label: 'Путь образа', sort: 'str', cls: 'path-cell', val: r => r.imagePath, html: r => `<span class="mono text-xs text-emerald-100/60">${esc(r.imagePath ?? '-')}</span>` },
                        colDate('keymod', 'Ключ изменён', 'keyModified'),
                        { key: 'flag', label: 'Флаг', sort: 'str', val: r => r.flag, html: r => r.flag === 'blacklist' ? '<span class="tag tag-red">blacklist</span>' : (r.flag ? `<span class="tag tag-amber">${esc(r.flag)}</span>` : '') }
                    ], (rec.drivers || []).map(d => ({ ...d, _hot: !!d.flag })), 'Нет данных о драйверах');

                case 'services': {
                    const rows = (rec.services || []).map(s => ({ ...s, _hot: s.exists && s.status !== 'running' }));
                    return '<p class="text-emerald-100/40 text-xs mb-2">Критичные для артефактов службы — читеры останавливают их, чтобы ослепить Windows (EventLog, PcaSvc, BAM...).</p>' + renderTable(id, [
                        { key: 'name', label: 'Служба', sort: 'str', cls: 'mono text-xs', val: r => r.name, html: r => esc(r.name) },
                        { key: 'disp', label: 'Название', sort: 'str', val: r => r.displayName, html: r => esc(r.displayName ?? '-') },
                        { key: 'exists', label: 'Найдена', sort: 'str', val: r => r.exists ? 1 : 0, html: r => r.exists ? '<span class="tag tag-green">да</span>' : '<span class="tag tag-amber">нет</span>' },
                        { key: 'status', label: 'Статус', sort: 'str', val: r => r.status, html: r => r.status === 'running' ? '<span class="tag tag-green">running</span>' : `<span class="tag tag-red">${esc(r.status)}</span>` },
                        { key: 'start', label: 'Тип запуска', sort: 'num', cls: 'text-xs', val: r => r.startType, html: r => esc(startTypeName(r.startType)) },
                        { key: 'pid', label: 'PID', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.pid || 0, html: r => esc(r.pid ? String(r.pid) : '-') },
                        colDate('started', 'Время старта', 'startedAt')
                    ], rows, 'Нет данных о службах');
                }

                default:
                    return '';
            }
        }

        function startTypeName(v) {
            return ({ 0: 'boot', 1: 'system', 2: 'auto', 3: 'manual', 4: 'disabled' })[v] ?? ('type ' + v);
        }

        // USN reason flags: DELETE/RENAME/CREATE — самые интересные, подсвечиваем.
        function reasonTags(r) {
            if (!r) return '';
            return String(r).split('|').map(t => {
                const hot = /^(DELETE|RENAME_OLD|RENAME_NEW|CREATE)$/.test(t);
                return `<span class="tag ${hot ? 'tag-amber' : 'tag-muted'}" style="margin-right:2px">${esc(t)}</span>`;
            }).join('');
        }

        // ─── Timeline: единая лента времени из всех артефактов ────────────
        // Собирает события с известным временем из USN + Prefetch + ShimCache
        // + BAM + артефактов запуска в одну хронологию (новые сверху):
        // «в 19:03 запущен X, в 19:05 удалён Y» — рассинхрон виден сразу.
        function timelineRows(rec) {
            const rows = [];
            const push = (time, source, what, path, hot) => {
                const t = new Date(time || 0).getTime() || 0;
                if (t < 946684800000) return; // до 2000 — мусор/ноль
                rows.push({ _t: time, _src: source, _what: what, _path: path || '', _hot: !!hot });
            };
            (rec.usn || []).forEach(u => push(u.t ? Number(u.t) : 0, 'USN', (u.dir ? 'папка ' : '') + (u.r || ''), (u.p || '') + (u.p && !String(u.p).endsWith(u.n) ? '\\' + (u.n || '') : (u.n || '')), u.m));
            (rec.prefetch || []).forEach(p => push(p.modified, 'Prefetch', 'запуск', p.name, p.matched));
            (rec.shimcache || []).forEach(s => push(s.modified, 'ShimCache', s.executed ? 'запуск' : 'замечен', s.path, s.matched));
            (rec.bam || []).forEach(b => push(b.lastRun, 'BAM/' + (b.source || ''), 'запуск', b.path, b.matched));
            (rec.execTraces || []).forEach(e => push(e.lastRun, e.source, 'запуск' + (e.count ? ' ×' + e.count : ''), e.path || e.name, e.matched));
            (rec.deletedFiles || []).forEach(f => push(f.Deleted || f.deleted, 'Удалён', 'удаление', f.Path || f.path, true));
            rows.sort((a, b) => new Date(b._t) - new Date(a._t));
            return rows;
        }

        // ─── Overview / Cleanup (custom renderers) ────────────────────────
        function renderOverview(rec) {
            let html = `<div class="mb-4 text-sm text-emerald-100/50">Проверил: <span class="mono text-amber-400">${esc(rec.adminDisplayName || rec.adminUser || '-')}</span> · ${fmtDate(rec.timestamp)} · длительность ${Number(rec.elapsedSeconds || 0).toFixed(1)}с</div>`;
            // Авто-вердикт (эвристический скоринг, считается на сервере при загрузке)
            if (rec.verdict && rec.verdict.level) {
                const v = rec.verdict;
                const vmap = { clean: ['tag-green', 'Чисто', 'ph-check-circle', 'border-emerald-500/50'], suspicious: ['tag-amber', 'Подозрительно', 'ph-warning', 'border-amber-500/50'], flagged: ['tag-red', 'Находки', 'ph-warning-octagon', 'border-rose-500/60'] };
                const [cls, txt, icon, border] = vmap[v.level] || vmap.suspicious;
                html += `<div class="panel p-5 mb-5 border-l-4 ${border}">
                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                        <i class="ph ${icon} text-xl" style="color:var(--emerald)"></i>
                        <span class="text-white font-bold">Авто-вердикт:</span>
                        <span class="tag ${cls}">${txt}</span>
                        <span class="mono text-emerald-100/50 text-xs">score ${v.score}</span>
                        <button class="btn btn-secondary btn-sm ml-auto" id="aiBtn" onclick="runAi()"><i class="ph ph-robot"></i> AI-анализ</button>
                    </div>
                    ${(v.reasons || []).length ? '<ul class="text-sm text-emerald-100/60 space-y-1">' + v.reasons.map(r => `<li>· ${esc(r.reason)} <span class="text-emerald-100/30 text-xs">+${r.points}</span></li>`).join('') + '</ul>' : '<p class="text-emerald-100/40 text-sm">Подозрительного не найдено.</p>'}
                    <div id="aiVerdictBox"></div>
                </div>`;
            }
            // Результат прежнего AI-анализа (если уже делали)
            if (rec.aiVerdict) {
                const a = rec.aiVerdict;
                const amap = { clean: 'tag-green', suspicious: 'tag-amber', flagged: 'tag-red' };
                html += `<div class="panel p-5 mb-5"><h3 class="text-white font-bold mb-2 flex items-center gap-2"><i class="ph ph-robot text-emerald-300"></i>AI-анализ <span class="tag ${amap[a.level] || 'tag-amber'}">${esc(a.level)}</span><span class="mono text-xs text-emerald-100/40">${a.confidence}% · ${esc(a.model || '')}</span></h3>
                    <p class="text-sm text-emerald-100/70 mb-2">${esc(a.summary)}</p>
                    ${(a.findings || []).length ? '<ul class="text-sm text-emerald-100/50 space-y-1 mb-2">' + a.findings.map(f => '<li>· ' + esc(f) + '</li>').join('') + '</ul>' : ''}
                    <p class="text-xs text-amber-300/80">Рекомендация: ${esc(a.recommendation || '-')}</p></div>`;
            }
            // Админ-статус проверки + заметка
            const meta = rec.adminMeta || {};
            html += `<div class="panel p-5 mb-5">
                <h3 class="text-white font-bold mb-3 flex items-center gap-2"><i class="ph ph-gavel text-emerald-300"></i>Решение проверяющего</h3>
                <div class="flex items-center gap-3 flex-wrap">
                    <select id="adminStatus" class="w-48">
                        <option value=""${!meta.status ? ' selected' : ''}>— без статуса —</option>
                        <option value="review"${meta.status === 'review' ? ' selected' : ''}>На рассмотрении</option>
                        <option value="banned"${meta.status === 'banned' ? ' selected' : ''}>Бан</option>
                        <option value="cleared"${meta.status === 'cleared' ? ' selected' : ''}>Оправдан</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="saveMeta()"><i class="ph ph-floppy-disk"></i> Сохранить</button>
                    ${meta.by ? `<span class="text-xs text-emerald-100/40">${esc(meta.by)} · ${fmtDate(meta.at)}</span>` : ''}
                </div>
                <textarea id="adminNote" rows="2" placeholder="Заметка к проверке (видна только админам)..." class="w-full mt-3">${esc(meta.note || '')}</textarea>
            </div>`;
            // Сравнение с другим сканом (напр. предыдущей проверкой игрока)
            html += `<div class="panel p-5 mb-5">
                <h3 class="text-white font-bold mb-2 flex items-center gap-2"><i class="ph ph-git-diff text-emerald-300"></i>Сравнить с другим сканом</h3>
                <div class="flex items-center gap-3 flex-wrap">
                    <input type="text" id="diffInput" placeholder="ID скана или ссылка /scans/<id>" class="flex-1 min-w-[240px] mono text-xs">
                    <button class="btn btn-secondary btn-sm" onclick="runDiff()"><i class="ph ph-git-diff"></i> Сравнить</button>
                </div>
                <div id="diffBox" class="mt-3"></div>
            </div>`;
            // Среда выполнения: сканер продолжает работу под VM/песочницей,
            // но сигналит — запуск CS2-чекера с виртуалки сам по себе подозрителен.
            if ((rec.envFlags || []).length) {
                html += `<div class="panel p-4 mb-5 border-l-4 border-rose-500/60"><h3 class="text-rose-300 font-bold mb-2 flex items-center gap-2"><i class="ph ph-warning-octagon"></i>Среда выполнения подозрительна</h3><div class="flex flex-wrap gap-2">`
                    + rec.envFlags.map(f => `<span class="tag tag-red mono">${esc(f)}</span>`).join('')
                    + `</div><p class="text-emerald-100/40 text-xs mt-2">Признаки виртуальной машины или песочницы на ПК игрока.</p></div>`;
            }
            const hw = rec.hardware;
            if (hw) {
                html += `<div class="grid grid-cols-1 xl:grid-cols-2 gap-5">`;
                html += `<div class="panel p-5"><h3 class="text-white font-bold mb-3 flex items-center gap-2"><i class="ph ph-cpu text-emerald-300"></i>Hardware</h3><table class="w-full text-sm">`;
                const row = (k, v, cls) => `<tr><td class="text-emerald-100/40 py-1.5 w-44">${k}</td><td class="${cls || ''}">${v}</td></tr>`;
                html += row('Hostname', `<span class="mono">${esc(hw.hostname)}</span>`);
                html += row('Username', `<span class="mono">${esc(hw.username)}</span>`);
                html += row('OS', esc(hw.osVersion));
                html += row('MachineGuid', `<span class="mono text-xs">${esc(hw.machineGuid)}</span>`);
                html += row('CPU', `${esc(hw.cpuName)} <span class="text-emerald-100/40 text-xs">(ID: ${esc(hw.cpuId)})</span>`);
                html += row('Board', `${esc(hw.boardVendor)} ${esc(hw.boardProduct)} <span class="text-emerald-100/40 text-xs">(S/N: ${esc(cleanSerial(hw.boardSerial))})</span>`);
                html += row('GPU', esc(hw.gpuName));
                html += row('System S/N', `<span class="mono">${esc(cleanSerial(hw.systemSerial))}</span>`);
                (hw.disks || hw.Disks || []).forEach((d, i) => {
                    html += row('Disk ' + i, `<span class="mono text-xs">${esc(g(d, 'model', 'Model'))} · S/N: ${esc(cleanSerial(g(d, 'serialNumber', 'SerialNumber')))} · ${fmtSizeGB(g(d, 'sizeGB', 'SizeGB'))}</span>`);
                });
                html += row('HWID', `<span class="mono text-rose-400 font-bold">${esc(hw.hwid)}</span> <button class="btn btn-ghost btn-icon btn-sm" title="Копировать" onclick="navigator.clipboard.writeText('${esc(hw.hwid)}').then(()=>toast('HWID скопирован'))"><i class="ph ph-copy"></i></button>`, '');
                html += `</table></div>`;
                html += `<div>`;
                if (rec.steam && (rec.steam.accounts || []).length) {
                    html += `<div class="panel p-5 mb-5"><h3 class="text-white font-bold mb-3 flex items-center gap-2"><i class="ph ph-steam-logo text-emerald-300"></i>Steam</h3>`;
                    html += `<p class="text-emerald-100/40 text-xs mb-2 mono">${esc(rec.steam.steamPath || '')}</p><table class="w-full text-sm"><thead><tr class="border-b border-emerald-300/15"><th class="text-left py-2">SteamID</th><th class="text-left py-2">Аккаунт</th><th class="text-left py-2">Последний</th><th class="text-left py-2">Время</th></tr></thead><tbody>`;
                    rec.steam.accounts.forEach(a => {
                        const sid = String(g(a, 'steamId', 'SteamID') || '');
                        const badgeBtn = /^\d{10,20}$/.test(sid)
                            ? ` <button class="btn btn-ghost btn-icon btn-sm" title="Trust Badge: публичная карточка проверки" onclick="event.stopPropagation();copyBadge('${sid}')"><i class="ph ph-seal-check"></i></button>`
                            : '';
                        html += `<tr class="border-b border-emerald-300/10"><td class="mono py-2">${esc(sid)}${badgeBtn}</td><td>${esc(g(a, 'accountName', 'AccountName'))}</td><td>${g(a, 'mostRecent', 'MostRecent') ? '✓' : ''}</td><td class="text-emerald-100/40 text-xs">${fmtTs(g(a, 'timestamp', 'Timestamp'))}</td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
                html += `</div></div>`;
            }
            return html;
        }

        function renderCleanup(rec) {
            const c = rec.cleanup || {};
            const iniDisk = c.iniOnDisk || [];
            const iniDel = c.iniDeleted || [];
            const tools = c.prefetchTools || [];
            const journals = c.journals || [];
            const wiped = journals.filter(j => j.wiped);

            let banner;
            if (!iniDisk.length && !iniDel.length && !tools.length && !wiped.length) {
                banner = `<div class="panel p-4 mb-5 flex items-center gap-3"><i class="ph ph-check-circle text-emerald-400 text-xl"></i><div><div class="text-emerald-300 font-semibold">Следов очистки не найдено</div><div class="text-emerald-100/40 text-xs">shellbag_analyzer_cleaner.ini / PrivaZer.ini не найдены ни на диске, ни в USN-журнале; fsutil/wevtutil не запускались; журналы USN старше загрузки системы.</div></div></div>`;
            } else {
                banner = `<div class="panel p-4 mb-5 flex items-center gap-3" style="border-color:rgba(244,63,94,.35)"><i class="ph ph-warning text-rose-400 text-xl"></i><div><div class="text-rose-300 font-semibold">Обнаружены следы очистки!</div><div class="text-emerald-100/40 text-xs">ini на диске: ${iniDisk.length} · удалённых ini в USN: ${iniDel.length} · инструментов в prefetch: ${tools.length} · пересозданных журналов: ${wiped.length}</div></div></div>`;
            }

            let html = banner;
            html += `<h3 class="text-amber-400 font-bold mb-2">INI клинеров на диске — shellbag_analyzer_cleaner.ini / PrivaZer.ini (${iniDisk.length})</h3>`;
            html += renderTable('cleanup_ini', [
                { key: 'name', label: 'Файл', sort: 'str', cls: 'mono text-xs whitespace-nowrap', val: r => r.name, html: r => esc(r.name ?? '-') },
                colPath,
                colDate('created', 'Создан', 'created'),
                colDate('modified', 'Изменён', 'modified')
            ], iniDisk.map(x => ({ ...x, _hot: true })), 'Файлы не найдены (поиск: %USERPROFILE%, %PUBLIC%, %ProgramData%, Windows\\Temp, глубина 5)');

            html += `<h3 class="text-amber-400 font-bold mb-2 mt-5">Удалённые ini клинеров в USN-журнале (${iniDel.length})</h3>`;
            html += renderTable('cleanup_usn', [
                { key: 'name', label: 'Имя', sort: 'str', val: r => r.name, html: r => esc(r.name ?? '-') },
                colPath,
                colDate('deleted', 'Удалён', 'deleted')
            ], iniDel.map(x => ({ ...x, _hot: true })), 'Записей об удалении нет');

            html += `<h3 class="text-amber-400 font-bold mb-2 mt-5">Инструменты очистки в Prefetch — FSUTIL / WEVTUTIL (${tools.length})</h3>`;
            html += `<p class="text-emerald-100/40 text-xs mb-2">fsutil usn deletejournal стирает USN-журнал, wevtutil cl чистит журналы событий. «Изменён» ≈ время последнего запуска утилиты.</p>`;
            html += renderTable('cleanup_pftools', [
                { key: 'name', label: 'Программа', sort: 'str', cls: 'mono text-xs whitespace-nowrap', val: r => r.name, html: r => `<span class="text-rose-300 font-semibold">${esc(r.name ?? '-')}</span>` },
                colPath,
                colDate('modified', 'Изменён (посл. запуск)', 'modified'),
                colDate('created', 'Создан (первый запуск)', 'created'),
                { key: 'size', label: 'Размер .pf', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.size || 0, html: r => esc(r.size ? Math.round(r.size / 1024) + ' KB' : '-') }
            ], tools.map(x => ({ ...x, _hot: true })), 'FSUTIL.EXE / WEVTUTIL.EXE не запускались или скан собран старой версией сканера');

            html += `<h3 class="text-amber-400 font-bold mb-2 mt-5">USN-журналы по дискам (${journals.length})</h3>`;
            html += `<p class="text-emerald-100/40 text-xs mb-2">Проверка по принципу CheckDeletedUSN: если $UsnJrnl создан ПОСЛЕ загрузки системы — журнал был стёрт и пересоздан.</p>`;
            html += renderTable('cleanup_journals', [
                { key: 'drive', label: 'Диск', sort: 'str', cls: 'mono', val: r => r.drive, html: r => esc(r.drive) },
                { key: 'avail', label: 'Доступен', sort: 'str', val: r => r.available ? 1 : 0, html: r => r.available ? '<span class="tag tag-green">да</span>' : `<span class="tag tag-amber">${esc(r.error || 'нет')}</span>` },
                { key: 'jid', label: 'Journal ID', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.journalId || 0, html: r => esc(String(r.journalId ?? '-')) },
                { key: 'first', label: 'First USN', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.firstUsn || 0, html: r => esc(String(r.firstUsn ?? '-')) },
                { key: 'next', label: 'Next USN', sort: 'num', cls: 'mono text-xs text-emerald-100/40', val: r => r.nextUsn || 0, html: r => esc(String(r.nextUsn ?? '-')) },
                colDate('created', 'Журнал создан', 'createdAt'),
                colDate('boot', 'Загрузка ОС', 'bootTime'),
                { key: 'wiped', label: 'Вердикт', sort: 'num', val: r => r.wiped ? 1 : 0, html: r => r.wiped ? '<span class="tag tag-red">ПОЧИЩЕН</span>' : '<span class="tag tag-green">ok</span>' }
            ], journals.map(x => ({ ...x, _hot: !!x.wiped })), 'Нет данных о журналах (нужны права администратора)');

            // ─── Удалённые файлы и директории (MFT + USN) ────────────────
            const delFiles = rec.deletedFiles || [];
            const delDirs = rec.deletedDirs || [];
            html += `<h3 class="text-amber-400 font-bold mb-2 mt-5">Удалённые файлы (${delFiles.length})</h3>`;
            html += renderTable('cleanup_delfiles', [
                colName, colPath, colDate('deleted', 'Удалён', 'Deleted', 'deleted')
            ], delFiles, 'Нет удалённых файлов');
            html += `<h3 class="text-amber-400 font-bold mb-2 mt-5">Удалённые директории (${delDirs.length})</h3>`;
            html += renderTable('cleanup_deldirs', [
                colName, colPath, colDate('deleted', 'Удалена', 'Deleted', 'deleted')
            ], delDirs, 'Нет удалённых директорий');
            return html;
        }

        // ─── Render ───────────────────────────────────────────────────────
        function renderContent() {
            const searchBar = document.getElementById('tabSearchBar');
            const input = document.getElementById('tabSearch');
            const custom = curTab === 'overview' || curTab === 'cleanup';
            searchBar.classList.toggle('hidden', custom);
            if (!custom) { input.value = st(curTab).q; }

            let html;
            if (curTab === 'overview') html = renderOverview(REC);
            else if (curTab === 'cleanup') html = renderCleanup(REC);
            else html = tabTable(curTab, REC);
            document.getElementById('content').innerHTML = html;
        }

        // AI-анализ скана через внешний LLM (кнопка в карточке вердикта).
        async function runAi() {
            const btn = document.getElementById('aiBtn');
            const box = document.getElementById('aiVerdictBox');
            if (btn) { btn.classList.add('is-loading'); btn.disabled = true; }
            try {
                const res = await fetch('/api/scans/ai/' + scanId, { method: 'POST', headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) { toast(data.message || 'AI-анализ недоступен', 'error'); return; }
                REC.aiVerdict = data.ai;
                const a = data.ai;
                const amap = { clean: 'tag-green', suspicious: 'tag-amber', flagged: 'tag-red' };
                box.innerHTML = `<div class="mt-3 pt-3 border-t border-emerald-300/10">
                    <p class="text-sm text-white font-semibold mb-1 flex items-center gap-2"><i class="ph ph-robot text-emerald-300"></i>AI: <span class="tag ${amap[a.level] || 'tag-amber'}">${esc(a.level)}</span><span class="mono text-xs text-emerald-100/40">${a.confidence}%</span></p>
                    <p class="text-sm text-emerald-100/70 mb-1">${esc(a.summary)}</p>
                    ${(a.findings || []).map(f => '<p class="text-sm text-emerald-100/50">· ' + esc(f) + '</p>').join('')}
                    <p class="text-xs text-amber-300/80 mt-1">Рекомендация: ${esc(a.recommendation || '-')}</p>
                </div>`;
            } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
            finally { if (btn) { btn.classList.remove('is-loading'); btn.disabled = false; } }
        }

        // Trust Badge: публичная карточка «игрок проверен» по SteamID.
        function copyBadge(sid) {
            const url = location.origin + '/badge/' + sid;
            navigator.clipboard.writeText(url).then(() => toast('Ссылка на Trust Badge скопирована')).catch(() => {});
        }

        // Сравнение со старым сканом: что появилось/исчезло между проверками.
        async function runDiff() {
            const box = document.getElementById('diffBox');
            const raw = document.getElementById('diffInput').value.trim();
            const otherId = (raw.match(/[a-f0-9]{16,64}/) || [])[0];
            if (!otherId) { toast('Введите ID скана', 'error'); return; }
            if (otherId === scanId) { toast('Это тот же скан', 'error'); return; }
            box.innerHTML = '<p class="text-emerald-100/40 text-xs">Считаем…</p>';
            const res = await fetch('/api/scans/diff?a=' + otherId + '&b=' + scanId, { headers: authHeaders() });
            if (!res.ok) { box.innerHTML = '<p class="text-rose-400 text-xs">Скан не найден</p>'; return; }
            const data = await res.json();
            if (!data.changes.length) { box.innerHTML = '<p class="text-emerald-300 text-xs">Изменений нет — артефакты совпадают.</p>'; return; }
            const srcNames = { prefetch: 'Prefetch', shimcache: 'ShimCache', bam: 'BAM', execTraces: 'Запуски', processes: 'Процессы', drivers: 'Драйверы', results: 'Читы', deletedFiles: 'Удалённые' };
            box.innerHTML = `<p class="text-xs text-emerald-100/40 mb-2">Изменений: ${data.changes.length} (относительно более раннего скана)</p>
                <div class="max-h-72 overflow-y-auto"><table class="w-full text-sm"><tbody>` +
                data.changes.slice(0, 300).map(c => `<tr class="border-b border-emerald-300/10">
                    <td class="py-1.5 px-2">${c.change === 'added' ? '<span class="tag tag-red">новое</span>' : '<span class="tag tag-muted">исчезло</span>'}</td>
                    <td class="py-1.5 px-2"><span class="tag tag-muted">${esc(srcNames[c.source] || c.source)}</span></td>
                    <td class="py-1.5 px-2 mono text-xs text-emerald-100/60">${esc(c.path || c.name || '-')}</td>
                </tr>`).join('') + '</tbody></table></div>';
        }

        async function boot() {
            const res = await fetch('/api/scans/view/' + scanId, { headers: authHeaders() });
            if (!res.ok) {
                document.getElementById('content').innerHTML = '<div class="empty-state"><i class="ph ph-ghost"></i>Скан не найден или нет доступа</div>';
                return;
            }
            REC = await res.json();
            const hw = REC.hardware || {};
            document.getElementById('headTitle').textContent = (hw.hostname || 'Скан') + ' · ' + (hw.username || '');
            document.getElementById('headSub').textContent = `${fmtDate(REC.timestamp)} · проверил ${REC.adminDisplayName || REC.adminUser || '-'} · HWID ${hw.hwid || '-'}`;
            const hits = hitCount(REC);
            document.getElementById('headBadge').innerHTML = hits > 0 ? `<span class="tag tag-red text-sm px-3 py-1.5">${hits} находок</span>` : '<span class="tag tag-green text-sm px-3 py-1.5">чисто</span>';
            document.title = (hw.hostname || 'Скан') + ' — Clover';
            renderTabsBar();
            renderContent();
        }

        boot();
    </script>
</body>
</html>
